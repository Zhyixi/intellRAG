[pytest]
testpaths = tests
python_files = test*.py
asyncio_mode = auto
addopts = -m "not slow and not manual"
markers =
    unit: fast unit tests without external services
    api: FastAPI route tests through ASGI transport
    integration: tests or checks that touch external services
    performance: load, latency, or plotting tests
    evaluation: RAG quality and dataset evaluation workflows
    manual: manual-only scripts or checks that should not run by default
    slow: long-running tests that should not run by default
