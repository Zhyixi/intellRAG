name: Publish Qwen3.8 Strata image

on:
  workflow_dispatch:
  push:
    tags:
      - qwen38-strata-v*

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zhyixi/qwen38-strata
  STRATA_REVISION: 99f3dbd0b21d1401b3769e0c0d963913607f380b

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker system prune --all --force

      - name: Check out tested Strata revision
        run: |
          git clone https://github.com/Niko1221/Strata.git vendor/Strata
          git -C vendor/Strata checkout --detach "$STRATA_REVISION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish CUDA 13 image
        uses: docker/build-push-action@v6
        with:
          context: vendor/Strata
          platforms: linux/amd64
          push: true
          build-args: |
            CUDA_ARCHITECTURES=86;89
            BUILD_VISION=0
          tags: |
            ${{ env.IMAGE }}:cuda13-sm86-sm89
            ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.STRATA_REVISION }}
            org.opencontainers.image.description=Strata engine for Qwen3.8-Flash-Next GSQ-RCO GGUF (sm86 and sm89)
