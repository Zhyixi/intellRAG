[slack]
S_URL_OTHERS = https://hooks.slack.com/services/REDACTED
S_URL_PROD_ERROR = https://hooks.slack.com/services/REDACTED

[chat_setting]
enable=True
cloud = False
model = MediaTek-Research/Breeze-7B-Instruct-v1_0
temperature= 0.7
top_k= 50
top_p= 0.95
do_sample=True

[pd_instr_setting]
enable=True
cloud = False
model = MediaTek-Research/Breeze-7B-Instruct-v1_0
temperature= 0.3
top_k= 10
top_p= 0.2
do_sample=True

[rag_setting]
enable=True
cloud = False
model = BAAI/bge-large-zh-v1.5
rerank_model=BAAI/bge-reranker-large
reranker_top_k = 5
retrivel_top_k = 5
index_dir = /app/db/rag_db
input_dir = /app/rag_doc
folder_path = /app/rag_doc
images_path = /app/db/images
retrive_mode = vector
rag_chunk_size=1024
[redis]
name = llm_redis

[auth]
login_enable = True
; 面試／脫敏：保留登入頁，任意帳密皆通過，側欄顯示下方假資料（不接 LDAP）
